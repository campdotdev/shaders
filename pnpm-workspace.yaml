packages:
  - 'apps/*'
  - 'packages/*'
  - 'registry'
  - 'tooling/*'

# Supply-chain hardening (react-doctor require-pnpm-hardening, 2026-08-11).
# minimumReleaseAge: don't install versions published in the last 7 days
# (10080 minutes) — malware that gets caught and unpublished usually dies
# inside that window. trustPolicy: refuse a package whose provenance/signature
# trust weakens between resolutions. Neither changes the resolved dependency
# set; both only constrain future re-locks.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
catalog:
  vite: ^8.0.14
  vitest: ^4.1.7
