name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # No registry-url here: setup-node would write an
      # _authToken=${NODE_AUTH_TOKEN} line to .npmrc, and with no token set
      # pnpm treats the empty value as configured auth and skips the OIDC
      # exchange, publishing anonymously (E404).
      # See https://github.com/actions/setup-node/issues/1551
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm >= 10 supports npm OIDC trusted publishing natively, so no global
      # npm upgrade is needed — pnpm publishes without delegating to npm.
      # Stay on pnpm 10.x: OIDC publish regressed in pnpm 11
      # (https://github.com/pnpm/pnpm/issues/11513).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # TODO: When user demand justifies it, add a parallel `canary` job that runs
      # on the same push and does:
      #   pnpm exec changeset version --snapshot canary
      #   pnpm exec changeset publish --tag canary --no-git-tag
      # That publishes a per-commit prerelease to the `canary` dist-tag without
      # consuming the pending changeset files, so the next "Version Packages"
      # PR still ships them as a stable release. Hold off pre-1.0 — every
      # release is effectively a canary right now.
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          VERSION=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[0].version')
          TAG="v${VERSION}"

          # The version-bump PR's merge commit may already be tagged from a
          # prior partially-successful run (e.g., publish failed, tag pushed
          # later). Reuse the existing remote tag instead of trying to retag
          # HEAD — HEAD here may include extra commits past the bump.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote, reusing it for the release."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
