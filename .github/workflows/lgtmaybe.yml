# Reviews trusted contributors' pull requests with lgtmaybe and OpenRouter.
# PR code is read through GitHub's API and is never checked out or executed.
name: lgtmaybe

on:
  pull_request_target:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  authorize:
    # Only PR events and slash-command comments on PRs reach the permission check.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/improve') ||
        contains(github.event.comment.body, '/ask') ||
        contains(github.event.comment.body, '/describe') ||
        contains(github.event.comment.body, '/diagram')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      # Automatic reviews and paid slash commands are limited to users with write
      # access. author_association can't decide this: it reads CONTRIBUTOR for a
      # private org member, so every automatic review was skipped.
      - id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.pull_request.user.login || github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission || echo none)
          echo "$ACTOR has $permission access"
          if [[ $permission == admin || $permission == write ]]; then
            echo allowed=true >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    # Job-level concurrency prevents rejected comments from cancelling reviews.
    concurrency:
      group: lgtmaybe-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: MattJColes/lgtmaybe@32bbe286f13030438503036a1ed8d2e88d80a0e6 # v2.8.5
        with:
          provider: openrouter
          model: anthropic/claude-sonnet-4-6
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          image: ghcr.io/mattjcoles/lgtmaybe@sha256:425d644f1ec2adb73e942bfac47ebac796991fbb37d57fbf81cbeab51adaa545
