name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each queued pull request on top of main and the
  # pull requests ahead of it, and waits for the required checks below.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-typecheck-lint:
    name: Build · Typecheck · Lint · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Reports the dead code, complexity, and duplication a pull request adds, as
  # annotations on the diff and a job summary, without failing the job. Exit 0
  # is a clean audit and 1 means findings. Any other code means fallow itself
  # broke, such as a bad .fallowrc.json, so that fails the job. To make the
  # audit a blocking gate, fail on exit 1 as well.
  fallow-audit:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit diffs against the merge base, so it needs history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit the changes against the base branch
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          annotations_status=0
          summary_status=0
          pnpm exec fallow audit --base "$BASE_REF" --format github-annotations --quiet || annotations_status=$?
          pnpm exec fallow audit --base "$BASE_REF" --format github-summary --quiet >> "$GITHUB_STEP_SUMMARY" || summary_status=$?
          for status in "$annotations_status" "$summary_status"; do
            if [ "$status" -gt 1 ]; then
              echo "::error::fallow audit exited $status, which means the analysis failed, not that it found issues"
              exit "$status"
            fi
          done

  # Visual shards must render in the exact container snap.sh bakes the Linux
  # baselines in. A bare ubuntu runner ships a different font set, so fontconfig
  # resolves the `monospace` fallback to a different font (the image lands on
  # WenQuanYi Zen Hei Mono) and every DOM baseline that contains text drifts.
  # Resolve the image tag from the apps/docs-tests entry in the lockfile so a
  # @playwright/test bump can never drift from the container version.
  playwright-version:
    name: Resolve Playwright container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        run: |
          versions=$(awk '
            /^  apps\/docs-tests:$/ { in_importer=1; next }
            in_importer && /^  [^ ]/ { in_importer=0 }
            in_importer && /^      .@playwright\/test.:$/ { in_dep=1; next }
            in_dep && /version:/ { v=$2; sub(/\(.*/, "", v); print v; in_dep=0 }
          ' pnpm-lock.yaml | sort -u)
          if [ -z "$versions" ]; then
            echo "no @playwright/test entry under the apps/docs-tests importer in pnpm-lock.yaml" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "multiple @playwright/test versions under the apps/docs-tests importer: $versions" >&2
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  # Playwright runs the suite on one worker, so the matrix splits it across
  # runners instead. Each shard builds the docs site itself: Playwright's
  # webServer rebuilds it with INCLUDE_DEV_ROUTES and --force, regardless of
  # what ran before, so a separate build step, or a wait on the build job,
  # would only add time.
  visual-regression-shard:
    name: Visual regression (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: playwright-version
    strategy:
      # Let every shard finish, so the other shards still report when one fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Same image and platform as scripts/snap.sh (amd64 either way). Browsers
    # and their system deps are baked into the image at the matching version,
    # so there is no `playwright install` step here.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shaders/docs-tests test:visual --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ matrix.shard }}
          path: apps/docs-tests/test-results
          retention-days: 7

  # The ruleset requires a check named "Visual regression", and the matrix
  # reports one check per shard, so this job reports one result for all of
  # them. GitHub reads a skipped required check as a pass, so the job runs on
  # every outcome, a cancelled run included, and fails unless every shard
  # succeeded.
  visual-regression-gate:
    name: Visual regression
    if: always()
    needs: visual-regression-shard
    runs-on: ubuntu-latest
    steps:
      - if: needs.visual-regression-shard.result != 'success'
        run: |
          echo "::error::a visual regression shard ended with ${{ needs.visual-regression-shard.result }}"
          exit 1
