name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-typecheck-lint:
    name: Build · Typecheck · Lint · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The visual job must render in the exact container snap.sh bakes the Linux
  # baselines in. A bare ubuntu runner ships a different font set, so fontconfig
  # resolves the `monospace` fallback to a different font (the image lands on
  # WenQuanYi Zen Hei Mono) and every DOM baseline that contains text drifts —
  # the editor card shots caught this. Resolve the image tag from the
  # apps/docs-tests entry in the lockfile so a @playwright/test bump can never
  # drift from the container version.
  playwright-version:
    name: Resolve Playwright container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        run: |
          versions=$(awk '
            /^  apps\/docs-tests:$/ { in_importer=1; next }
            in_importer && /^  [^ ]/ { in_importer=0 }
            in_importer && /^      .@playwright\/test.:$/ { in_dep=1; next }
            in_dep && /version:/ { v=$2; sub(/\(.*/, "", v); print v; in_dep=0 }
          ' pnpm-lock.yaml | sort -u)
          if [ -z "$versions" ]; then
            echo "no @playwright/test entry under the apps/docs-tests importer in pnpm-lock.yaml" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "multiple @playwright/test versions under the apps/docs-tests importer: $versions" >&2
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: [build-typecheck-lint, playwright-version]
    # Same image and platform as scripts/snap.sh (amd64 either way). Browsers
    # and their system deps are baked into the image at the matching version,
    # so there is no `playwright install` step here.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @matter/docs-tests test:visual
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: apps/docs-tests/test-results
          retention-days: 7
